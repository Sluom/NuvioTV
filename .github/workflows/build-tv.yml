name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Dummy Keystore
        run: |
          keytool -genkey -v -keystore nuviotv.jks -alias nuviotv -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug -x validateSigningFullDebug --warning-mode=none --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-Debug-APK
          path: app/build/outputs/apk/**/*.apk
